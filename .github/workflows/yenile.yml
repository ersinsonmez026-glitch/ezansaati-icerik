name: Onaylı videoları yenile

# Onaylı videoları (videolar.json) aynı metin ve kaynak videoyla, güncel yazı düzeniyle yeniden üretir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/yenile.yml]

permissions:
  contents: write

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)) && pip install -q pillow
      - run: python3 arac/uret.py yenile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videolar
          git commit -m "Onaylı videolar yeni yazı düzeniyle yenilendi"
          git push
