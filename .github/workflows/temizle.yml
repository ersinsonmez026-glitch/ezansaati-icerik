name: jsDelivr önbelleğini temizle

# Yerinde yeniden üretilen videolar/fotoğraflar telefonlara eski hâliyle gitmesin diye jsDelivr önbelleği
# listedeki tüm dosyalar için temizlenir (ücretsiz purge.jsdelivr.net), sonra her dosya bir kez indirilip önbellek ısıtılır.
on:
  workflow_dispatch:

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, concurrent.futures as cf, collections
          yol = ['videolar.json', 'fotolar.json']
          yol += [x for v in json.load(open('videolar.json')) for x in (v['video'], v['kapak'])]
          yol += [x for f in json.load(open('fotolar.json')) for x in (f['resim'], f['kapak'])]
          yol += ['ozel.json'] + [x for f in json.load(open('ozel.json')) for x in (f['resim'], f['kapak'])]
          def p(y):
              u = f'https://purge.jsdelivr.net/gh/${{ github.repository }}@main/{y}'
              try:
                  return json.load(urllib.request.urlopen(u, timeout=60)).get('status', '?')
              except Exception as e:
                  return type(e).__name__
          with cf.ThreadPoolExecutor(6) as ex:
              print(len(yol), collections.Counter(ex.map(p, yol)))
          # Isıtma: her dosya bir kez indirilir, ilk izleyen kullanıcı GitHub'dan çekilmesini beklemesin
          import time; time.sleep(30)
          # Temizlemeden hemen sonra jsDelivr bir süre hata dönebiliyor (14 Ekim: 744 dosyanın 738'i): her dosya
          # artan aralıklarla 6 kez denenir, aynı anda az istek gönderilir.
          def isit(y):
              son = None
              for bekle in (0, 20, 40, 60, 90, 120):
                  time.sleep(bekle)
                  try:
                      if len(urllib.request.urlopen(f'https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/{y}', timeout=120).read()) > 0:
                          return True
                  except Exception as e:
                      son = type(e).__name__
              return son
          with cf.ThreadPoolExecutor(4) as ex:
              print('ısıtma', collections.Counter(ex.map(isit, yol)))
          PY
