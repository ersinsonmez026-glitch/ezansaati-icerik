name: Videoları onayla

# Taslaklardan seçilenleri (ör. 1,3,5) uygulamaya açar: videolar/ klasörü ve videolar.json güncellenir.
on:
  workflow_dispatch:
    inputs:
      secilen:
        description: 'Onaylanan taslak numaraları (ör. 1,3,5)'
        required: true

permissions:
  contents: write

jobs:
  onay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch -q origin taslak
          git checkout FETCH_HEAD -- taslak
          git reset -q -- taslak
          python3 arac/onay.py "${{ inputs.secilen }}"
          rm -rf taslak
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videolar videolar.json
          git commit -m "Onaylanan videolar: ${{ inputs.secilen }}"
          git pull -q --rebase; git push
          git push origin --delete taslak
