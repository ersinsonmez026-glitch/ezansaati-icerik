name: Ses adayı ara
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ses-ara.yml, arac/ses_ara.py, arac/ses_detay.py]
permissions:
  contents: write
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 arac/ses_detay.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ses_detay.json && git commit -m "Ses ayrıntı" && git pull -q --rebase && git push
