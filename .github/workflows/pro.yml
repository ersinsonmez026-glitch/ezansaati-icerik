name: Profesyonel video

# arac/pro.py: kısa metin, satır satır yumuşak yazı, sinematik renk, yavaş yakınlaşma.
# mod=ornek: verilen onaylı videolardan önizleme ("taslak" dalı, uygulamaya girmez).
# mod=hepsi: onaylı videoların hepsini yerinde yeniden üretir (videolar/ ve videolar.json).
on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'ornek ya da hepsi'
        default: 'ornek'
      kimlikler:
        description: 'ornek için video kimlikleri (virgülle)'
        default: ''

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)) && pip install -q pillow
      - run: python3 arac/pro.py "${{ inputs.mod }}" "${{ inputs.kimlikler }}"
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - if: inputs.mod == 'hepsi'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videolar videolar.json
          git commit -m "Onaylı videolar profesyonel düzenle yenilendi"
          git push
      - if: inputs.mod == 'ornek'
        run: |
          cp -r taslak /tmp/taslak
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan taslak-dal
          git rm -rfq .
          rm -rf taslak && cp -r /tmp/taslak taslak
          git add taslak
          git commit -qm "Profesyonel örnek videolar"
          git push -f origin taslak-dal:taslak
