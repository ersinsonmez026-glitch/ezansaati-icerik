name: Taslak videolar

# Pixabay'den video bulup ayet/hadis ve logo ekler; taslaklar "taslak" sürüm sayfasında izlenir.
# Uygulamaya girmez. Onay için "Videoları onayla" iş akışı çalıştırılır.
on:
  workflow_dispatch:
    inputs:
      adet:
        description: 'Kaç taslak video'
        default: '6'

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)) && pip install -q pillow
      - run: python3 arac/uret.py "${{ inputs.adet }}"
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete taslak --yes --cleanup-tag 2>/dev/null || true
          NOT=$(python3 -c "import json;print('\n'.join(f\"{t['no']}. {t['kaynak']} — {t['metin'][:60]}… ({t['sayfa']})\" for t in json.load(open('taslak/liste.json'))))")
          gh release create taslak taslak/*.mp4 taslak/*.jpg taslak/liste.json --target "$GITHUB_SHA" --prerelease \
            --title "Taslak videolar (onay bekliyor)" --notes "$NOT"
