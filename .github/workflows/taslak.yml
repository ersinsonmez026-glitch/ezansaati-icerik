name: Taslak videolar

# Pixabay'den video bulup ayet/hadis ve logo ekler. Taslaklar "taslak" dalına konur ve tarayıcıda
# jsDelivr bağlantısıyla izlenir; uygulamaya girmez. Onay için "Videoları onayla" iş akışı çalıştırılır.
on:
  workflow_dispatch:
    inputs:
      adet:
        description: 'Kaç taslak video'
        default: '6'
      kaynak:
        description: 'Kaynak: hepsi, commons, pixabay ya da pexels'
        default: 'hepsi'
      baglantilar:
        description: 'Pexels video bağlantıları (boşlukla ayrılmış; kaynak = pexels)'
        default: ''

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)) && pip install -q pillow
      - run: python3 arac/uret.py "${{ inputs.adet }}" "${{ inputs.kaynak }}"
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BAGLANTILAR: ${{ inputs.baglantilar }}
      - run: |
          cp -r taslak /tmp/taslak
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan taslak-dal
          git rm -rfq .
          rm -rf taslak && cp -r /tmp/taslak taslak
          git add taslak
          git commit -qm "Taslak videolar"
          git push -f origin taslak-dal:taslak
          SHA=$(git rev-parse HEAD)
          echo "## Taslaklar (izlemek için dokunun)" >> $GITHUB_STEP_SUMMARY
          for f in taslak/*.mp4; do echo "- https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SHA}/$f" >> $GITHUB_STEP_SUMMARY; done
